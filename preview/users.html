<style>
/* ===== DESIGN TOKENS =======================================================
   Mirrors Singular (V1.0.0): primitives -> semantic -> component.
   [figma] verbatim from the library · [brand] from #755BD8 · [derived] by us. */
:root{
  /* brand ramp — OKLCH, hue -71.3deg, 500 pinned to #755BD8, contrast-verified */
  --p-50:#F5F4FF; --p-100:#EAE8FF; --p-200:#D7D4FF; --p-300:#BFB7FF; --p-400:#9C89FF;
  --p-500:#755BD8; --p-600:#6246BE; --p-700:#4E349D; --p-800:#3A2678; --p-900:#271A54;
  /* neutrals — 300/800/950 are [figma]; the rest derived on their shared hue */
  --n-25:#FAFBFC; --n-50:#F5F7FA; --n-100:#EEF0F5; --n-200:#E0E4EC; --n-300:#CCD2E0;
  --n-400:#B5BCCC; --n-500:#9DA5B5; --n-600:#848C9D; --n-700:#5F6572; --n-800:#40444C;
  --n-900:#22252B; --n-950:#111317;
  /* secondary — brand gold #FAC333 pinned at 500. Monotone light->dark.
     Gold at brand lightness is 1.63:1 on white: fills take DARK ink, never
     white, and gold is never used as text above step 800.                   */
  --s-50:#FFFAEE;
  --s-100:#FEF2D9;
  --s-200:#FEE8B7;
  --s-300:#FEDA8B;
  --s-400:#FECE5D;
  --s-500:#FAC333;
  --s-600:#D3A100;
  --s-700:#AF8500;
  --s-800:#886600;
  --s-900:#604700;
  /* status — warning moved off amber to orange: brand gold sat only dE 4.0
     from the old #FAB219, so "warning" and "brand" were indistinguishable.
     Info moved off blue for the same reason against brand purple (dE 10.1).
     Every brand/status pair now separates by >= 15.                          */
  --success-50:#ECFBEA; --success-100:#D7F5D4; --success-200:#B1E9AC; --success-500:#0CA30C; --success-700:#008301;
  --warning-50:#FFF3ED; --warning-100:#FFE5D8; --warning-200:#FFCAB0; --warning-500:#F97C2F; --warning-700:#B75000;
  --danger-50:#FFF2F1;  --danger-100:#FFE4E1;  --danger-200:#FFC8C2;  --danger-500:#D03B3B;  --danger-700:#C83C3B;
  --info-50:#ECF8FC;    --info-100:#D7F0F7;    --info-200:#B2E1ED;    --info-500:#0090A8;    --info-700:#00798D;
  /* chart series — validated: CVD dE 24.7, normal-vision dE 30.9 */
  --series-issued:#755BD8; --series-redeemed:#1BAF7A;
  --grid:#EEF0F5; --axis:#CCD2E0;

  --sp-100:8px; --sp-150:12px; --sp-200:16px; --sp-300:24px; --sp-400:32px;
  --r-50:4px; --r-100:8px; --r-150:12px; --r-200:16px; --r-300:24px;
  --shadow-xs:0 1px 2px rgba(17,19,23,.05);
  --shadow-sm:0 1px 3px rgba(17,19,23,.06),0 1px 2px rgba(17,19,23,.04);
  --shadow-md:0 4px 12px rgba(17,19,23,.07),0 1px 3px rgba(17,19,23,.05);
  --shadow-lg:0 12px 32px rgba(17,19,23,.10),0 2px 8px rgba(17,19,23,.05);
  --focus:0 0 0 3px rgba(117,91,216,.28);

  /* FF Shamel Unique is licensed and cannot load here; IBM Plex Sans Arabic is
     the closest free humanist Arabic sans and a designed superfamily with its
     Latin counterpart, so the two scripts stay structurally harmonious. */
  --font-ar:"FF Shamel Unique","Tajawal","IBM Plex Sans Arabic","Noto Sans Arabic",sans-serif;
  --font-en:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sidebar-w:264px; --sidebar-w-collapsed:76px;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--n-50);color:var(--n-950);
     font-family:var(--font-en);font-size:14px;line-height:1.5;
     -webkit-font-smoothing:antialiased}
/* Arabic: the design system specifies line-height 1.5 and letter-spacing 0.
   letter-spacing MUST stay 0 — tracking breaks Arabic letter-joining. */
html[lang="ar"] body{font-family:var(--font-ar);letter-spacing:0}
html[lang="ar"] .num{font-family:var(--font-en)} /* Western numerals, KSA convention */

/* Poppins has no tabular figures and its digits are proportional (1 is half the
   width of 6), so this declaration is inert under Poppins and kept for the case
   where the numeral face changes. Figures here are inline or right-aligned, so
   nothing misaligns today — but a future amounts COLUMN (transactions, users)
   will need either right-alignment or a numeral face that aligns. */
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-100)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:-9999px;top:8px;z-index:100;
      background:var(--p-700);color:#fff;padding:10px 16px;border-radius:var(--r-100)}
.skip:focus{inset-inline-start:8px}

/* ---- app shell ---- */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:#fff;
  border-inline-end:1px solid var(--n-200);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;transition:width .18s ease,flex-basis .18s ease}
body[data-collapsed="true"] .sidebar{width:var(--sidebar-w-collapsed);flex-basis:var(--sidebar-w-collapsed)}
body[data-collapsed="true"] .nav-label,
body[data-collapsed="true"] .nav-group-label,
body[data-collapsed="true"] .brand-text,
body[data-collapsed="true"] .nav-chevron,
body[data-collapsed="true"] .nav-badge{display:none}
body[data-collapsed="true"] .nav-item{justify-content:center;padding-inline:0}
body[data-collapsed="true"] .brand{justify-content:center}

.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;margin-inline:12px;
  border-radius:var(--r-100);color:var(--n-800);font-weight:500;font-size:14px;
  text-decoration:none;cursor:pointer;position:relative;transition:background .12s}
.nav-item:hover{background:var(--n-100)}
.nav-item[aria-current="page"]{background:var(--p-50);color:var(--p-700)}
.nav-item[aria-current="page"] svg{color:var(--p-600)}
.nav-item svg{flex:0 0 20px;color:var(--n-600)}
.nav-group-label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--n-600);padding:0 24px;margin:20px 0 6px}
html[lang="ar"] .nav-group-label{letter-spacing:0;text-transform:none;font-size:12px}
.nav-chevron{margin-inline-start:auto;color:var(--n-500)}
.nav-badge{margin-inline-start:auto;background:var(--danger-500);color:#fff;font-size:11px;
  font-weight:600;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 6px}

/* ---- topbar ---- */
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--n-200);
  display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:20}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;height:38px;
  padding:0 12px;background:var(--n-50);border:1px solid var(--n-200);border-radius:var(--r-100);
  color:var(--n-600);cursor:pointer}
.search:hover{background:#fff;border-color:var(--n-300)}
.kbd{margin-inline-start:auto;font-size:11px;background:#fff;border:1px solid var(--n-200);
  border-radius:var(--r-50);padding:2px 6px;color:var(--n-600)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-100);
  color:var(--n-700);background:none;border:none;cursor:pointer;position:relative}
.icon-btn:hover{background:var(--n-100)}
.dot{position:absolute;top:7px;inset-inline-end:7px;min-width:16px;height:16px;padding:0 4px;
  background:var(--danger-500);color:#fff;font-size:10px;font-weight:700;border-radius:999px;
  display:grid;place-items:center;border:2px solid #fff}
.langtog{display:flex;background:var(--n-100);border-radius:var(--r-100);padding:3px;gap:2px}
.langtog button{border:none;background:none;padding:5px 12px;border-radius:var(--r-50);
  font-size:13px;font-weight:600;color:var(--n-700);cursor:pointer}
.langtog button[aria-pressed="true"]{background:#fff;color:var(--p-700);box-shadow:var(--shadow-xs)}

/* ---- date range dropdown ---- */
.dd{position:relative}
.dd-menu{position:absolute;z-index:40;inset-block-start:calc(100% + 6px);inset-inline-end:0;
  min-width:250px;background:#fff;border:1px solid var(--n-200);border-radius:var(--r-150);
  box-shadow:var(--shadow-lg);padding:6px;animation:ddIn .12s ease}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dd-menu{animation:none}}
.dd-opt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;
  background:none;border-radius:var(--r-100);cursor:pointer;text-align:start;
  font-size:14px;color:var(--n-900);font-family:inherit}
.dd-opt:hover,.dd-opt:focus-visible{background:var(--n-100);outline:none}
.dd-opt[aria-selected="true"]{color:var(--p-700);font-weight:600}
.dd-check{inline-size:16px;block-size:16px;flex:none;color:var(--p-600);visibility:hidden}
.dd-opt[aria-selected="true"] .dd-check{visibility:visible}
.dd-sep{height:1px;background:var(--n-200);margin:6px 4px}
.dd-sub{display:block;font-size:11.5px;color:var(--n-700);font-weight:400;margin-top:2px;line-height:1.35}
.dd-opt.dd-custom{align-items:flex-start}
.dd-opt.dd-custom .dd-check{margin-top:2px}

/* ---- cards ---- */
.card{background:#fff;border:1px solid var(--n-200);border-radius:var(--r-200);
  box-shadow:var(--shadow-xs)}
.card-h{display:flex;align-items:center;gap:12px;padding:20px 20px 0}
.card-t{font-size:15px;font-weight:600;color:var(--n-950)}
.card-sub{font-size:12px;color:var(--n-700);margin-top:2px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;
  border-radius:var(--r-100);font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;
  white-space:nowrap;transition:background .12s,border-color .12s}
.btn-primary{background:var(--p-500);color:#fff}
.btn-primary:hover{background:var(--p-600)}
.btn-primary:active{background:var(--p-700)}
.btn-ghost{background:#fff;border-color:var(--n-300);color:var(--n-800)}
.btn-ghost:hover{background:var(--n-50);border-color:var(--n-400)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-link{background:none;border:none;color:var(--p-700);font-weight:600;font-size:13px;cursor:pointer;padding:0}
.btn-link:hover{text-decoration:underline}

/* ---- attention rows ---- */
.att-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--n-100)}
.att-row:hover{background:var(--n-25)}
.att-ico{flex:0 0 36px;height:36px;border-radius:var(--r-100);display:grid;place-items:center}
.sev-critical .att-ico{background:var(--danger-50);color:var(--danger-700)}
.sev-warning  .att-ico{background:var(--warning-50);color:var(--warning-700)}
.sev-info     .att-ico{background:var(--info-50);color:var(--info-700)}
.att-t{font-size:14px;font-weight:600;color:var(--n-950)}
.att-d{font-size:13px;color:var(--n-700);margin-top:1px}
.att-count{font-size:20px;font-weight:700;margin-inline-start:auto}
.sev-critical .att-count{color:var(--danger-700)}
.sev-warning  .att-count{color:var(--warning-700)}
.sev-info     .att-count{color:var(--info-700)}

/* status pill — icon + label, never colour alone */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill-critical{background:var(--danger-50);color:var(--danger-700)}
.pill-warning{background:var(--warning-50);color:var(--warning-700)}
.pill-success{background:var(--success-50);color:var(--success-700)}
.pill-info{background:var(--info-50);color:var(--info-700)}

/* ---- skeleton / states ---- */
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk{background:linear-gradient(90deg,var(--n-100) 25%,var(--n-200) 37%,var(--n-100) 63%);
  background-size:200% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:var(--r-50)}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.empty{text-align:center;padding:36px 24px}
.empty-ico{width:44px;height:44px;border-radius:var(--r-100);background:var(--n-100);
  color:var(--n-600);display:grid;place-items:center;margin:0 auto 12px}
.empty-t{font-size:14px;font-weight:600;color:var(--n-900)}
.empty-d{font-size:13px;color:var(--n-700);margin-top:4px;max-width:34ch;margin-inline:auto}

/* ---- metric tile (points overview) ---- */
.mt{border:1px solid var(--n-200);border-radius:var(--r-150);padding:15px 14px 11px;
  background:#fff;display:flex;flex-direction:column;gap:1px;min-width:0}
.mt-l{font-size:11px;color:var(--n-700);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-v{font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.mt-d{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--n-700)}
.mt[data-tone="up"]   .mt-d{color:var(--success-700)}
.mt[data-tone="warn"] .mt-d{color:var(--warning-700)}
.mt-s{width:100%;height:58px;margin-top:auto;padding-top:10px;display:block;overflow:visible}

/* ---- twelve-month totals beneath the chart ---- */
.yr-tot{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--n-100);font-size:12px;color:var(--n-700)}
.yr-lbl{font-weight:600;color:var(--n-800)}
.yr-item{display:flex;align-items:center;gap:6px}
.yr-sw{width:9px;height:9px;border-radius:2px;flex:none}
.yr-item b{color:var(--n-950);font-weight:700;margin-inline-start:2px}


/* ---- offers ---- */
/* the one place brand gold leads: offers are the reward side of the product.
   Gold is 1.63:1 on white, so it never carries text — it fills, ink sits on it. */
.of-sum{display:flex;align-items:center;gap:10px;padding:16px 14px;border-radius:var(--r-100);
  background:var(--s-50);border:1px solid var(--s-200);font-size:12px;font-weight:600;color:var(--s-900)}
.of-sum-n{font-size:24px;font-weight:700;line-height:1}
.of-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--n-100);flex:1 1 0;min-height:0}
.of-row:first-child{border-top:none}
.of-dot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:var(--s-100);color:var(--s-900)}
.of-n{font-size:13px;font-weight:600;color:var(--n-950);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.of-m{font-size:11px;color:var(--n-700);margin-top:1px}
.of-foot{display:flex;gap:16px;padding-top:12px;margin-top:auto;border-top:1px solid var(--n-100);
  font-size:12px;color:var(--n-700)}
.of-foot b{color:var(--n-950);font-weight:700}
.rate-pill{background:var(--s-50);color:var(--s-900);border:1px solid var(--s-200)}


/* ---- chart ---- */
.chart-wrap{position:relative}
#tooltip{position:absolute;pointer-events:none;background:var(--n-950);color:#fff;
  border-radius:var(--r-100);padding:9px 11px;font-size:12px;box-shadow:var(--shadow-lg);
  opacity:0;transition:opacity .1s;z-index:30;min-width:150px}
.tt-row{display:flex;align-items:center;gap:7px;margin-top:5px}
.tt-sw{width:9px;height:9px;border-radius:2px;flex:none}
.tt-v{margin-inline-start:auto;font-weight:700}

/* ---- preview controls (NOT part of the product) ---- */
#pv{position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:60;background:var(--n-950);
  color:#fff;border-radius:var(--r-200);padding:12px 14px;box-shadow:var(--shadow-lg);font-size:12px;
  font-family:var(--font-en);max-width:290px}
#pv h4{margin:0 0 9px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--n-400)}
#pv .row{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
#pv button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;
  padding:5px 10px;border-radius:var(--r-50);font-size:11px;cursor:pointer;font-weight:600}
#pv button[aria-pressed="true"]{background:var(--p-500);border-color:var(--p-400)}
#pv .lbl{color:var(--n-400);font-size:10px;width:100%;margin-bottom:3px}
#pv[data-open="false"] .row{display:none}
#pv[data-open="false"] h4{margin:0}
#pv h4{user-select:none}

/* ================= RESPONSIVE =================
   Below 1100px the sidebar becomes an off-canvas drawer. It slides toward the
   inline-start edge, which is the LEFT in English and the RIGHT in Arabic — so
   the transform is written per-direction, not once for LTR.                */
#navScrim{display:none}
.menu-btn{display:none}

@media (max-width:1100px){
  .menu-btn{display:grid}
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;z-index:50;
    width:280px;flex-basis:280px;box-shadow:var(--shadow-lg);
    transform:translateX(-100%);transition:transform .22s ease}
  html[dir="rtl"] .sidebar{transform:translateX(100%)}
  body[data-nav="open"] .sidebar,
  html[dir="rtl"] body[data-nav="open"] .sidebar{transform:translateX(0)}
  /* the desktop collapse state must not leak into the drawer */
  body[data-collapsed="true"] .sidebar{width:280px;flex-basis:280px}
  body[data-collapsed="true"] .nav-label,
  body[data-collapsed="true"] .nav-group-label,
  body[data-collapsed="true"] .brand-text,
  body[data-collapsed="true"] .nav-badge{display:revert}
  body[data-collapsed="true"] .nav-item{justify-content:flex-start;padding-inline:12px}
  body[data-collapsed="true"] .brand{justify-content:flex-start}
  #navScrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(17,19,23,.45);
    opacity:0;pointer-events:none;transition:opacity .22s ease}
  body[data-nav="open"] #navScrim{opacity:1;pointer-events:auto}
  #collapseBtn{display:none}
}
@media (prefers-reduced-motion:reduce){ .sidebar,#navScrim{transition:none} }

@media (max-width:860px){
  main{padding:16px !important}
  .topbar{padding:0 14px;gap:10px}
  .search span:not(.kbd){display:none}
  .search{flex:0 0 38px;max-width:38px;padding:0;justify-content:center}
  .search .kbd{display:none}
  h1{font-size:20px !important}
  /* the action row wraps under the greeting instead of squeezing it */
  .att-row{flex-wrap:wrap;row-gap:10px}
  .att-row .btn{margin-inline-start:auto}
}
@media (max-width:640px){
  /* the row wraps and its controls share it */
  .hdr-actions{width:100%}
  .hdr-actions .btn:not([aria-label]){flex:1 1 auto;justify-content:center}
  /* the range control is a wrapper now, so it needs the rule the button had —
     without this it keeps its natural width, and in Arabic the menu anchored
     mid-row and ran off the right edge of the viewport */
  .hdr-actions .dd{flex:1 1 auto}
  .hdr-actions .dd > .btn{width:100%;justify-content:center}
  /* and the menu can never be wider than the screen it opens on */
  .dd-menu{min-width:0;width:100%;max-width:calc(100vw - 32px)}
}
@media (max-width:560px){
  .langtog button{padding:5px 9px;font-size:12px}
  .card-h{padding:14px 14px 0}
  .att-row{padding:12px 14px}
  .att-ico{flex-basis:30px;height:30px}
  .mt-v{font-size:18px}
  #pv{inset-inline:10px;inset-block-end:10px;max-width:none}
  #pv .row{gap:4px}
}

/* ===================================================================
   DATA TABLE — anatomy taken from the design system's table component.
   Same structure: search at the inline-start of the toolbar with the
   actions at the inline-end, a person cell stacking avatar + name +
   email, a formatted ID, the balance carrying the point mark inline,
   written-month dates, a row overflow menu, and the three-part footer
   (range · pages · rows-per-page).
   The component's green is replaced by the brand purple throughout.
   =================================================================== */
.tbl-wrap{background:#fff;border:1px solid var(--n-200);border-radius:var(--r-200);
  box-shadow:var(--shadow-xs);overflow:hidden}
.tbl-bar{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap}
.tbl-search{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;height:42px;

let LANG = "ar", STATE = "normal";
const t = k => (I18N[LANG][k] ?? I18N.en[k] ?? k);
const fmt = n => n.toLocaleString("en-US");   // Western numerals in BOTH languages

/* mock data — a service layer would replace this wholesale */
function interp(s, vars){
  const all = Object.assign({ name: t("app.userName").split(" ")[0] }, vars || {});
  return s.replace(/\{(\w+)\}/g, (m,k) => {
    if (!(k in all)) return m;
    let v = all[k];
    if (typeof v === "string" && v[0] === "@"){          // '@key:arg' -> localised phrase
      const [kk, arg] = v.slice(1).split(":");
      return interp(t(kk), { n: fmt(Number(arg)) });
    }
    return typeof v === "number" ? fmt(v) : v;
  });
}
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const vars = el.dataset.i18nVars ? JSON.parse(el.dataset.i18nVars) : null;
    let s = interp(t(el.dataset.i18n), vars);
    // empty-state copy arrives as one or two sentences; the lead sentence is the
    // heading and the remainder is the explanation, so each card says something
    // specific instead of repeating one generic title.
    const part = el.dataset.i18nPart;
    if (part){
      const cut = s.search(/[.!?\u061F\u06D4]\s/);
      if (cut > -1) s = (part === "head") ? s.slice(0, cut + 1) : s.slice(cut + 2).trim();
      else if (part === "tail") s = "";
    }
    el.textContent = s;
    if (part === "tail" && !s) el.style.display = "none";
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{
    el.setAttribute("aria-label", interp(t(el.dataset.i18nAria)));
  });
}
function setLang(l){
  LANG = l;
  const html = document.documentElement;
  html.lang = l;
  html.dir = (l === "ar") ? "rtl" : "ltr";     // structural mirror, not just copy
  applyI18n(); counts(); renderRows();
  [["btn-ar","btn-en"],["pv-ar","pv-en"]].forEach(([a,b])=>{
    document.getElementById(a).setAttribute("aria-pressed", l==="ar");
    document.getElementById(b).setAttribute("aria-pressed", l==="en");
  });
}
function setState(s){
  STATE = s; document.body.dataset.state = s;
  ["normal","loading","empty","error"].forEach(k=>
    document.getElementById("pv-"+k).setAttribute("aria-pressed", k===s));
  if (s==="normal") renderRows();
}
/* Off-canvas nav. Escape closes it and focus returns to the button that opened
   it, so keyboard users are never stranded inside a hidden drawer. */
function openNav(){
  document.body.dataset.nav = "open";
  document.getElementById("menuBtn").setAttribute("aria-expanded","true");
  const first = document.querySelector("#mainNav .nav-item"); if (first) first.focus();
}
function closeNav(){
  if (document.body.dataset.nav !== "open") return;
  document.body.dataset.nav = "closed";
  const b = document.getElementById("menuBtn");
  b.setAttribute("aria-expanded","false"); b.focus();
}
matchMedia("(min-width:1101px)").addEventListener("change", e => { if (e.matches) closeNav(); });
function togglePv(){
  const el=document.getElementById("pv"), open = el.dataset.open!=="true";
  el.dataset.open = open;
  document.getElementById("pvCaret").textContent = open ? "\u25BE" : "\u25B8";
}
function toggleSidebar(){
  const c = document.body.dataset.collapsed !== "true";
  document.body.dataset.collapsed = c;
  document.getElementById("pv-collapse").setAttribute("aria-pressed", c);
  document.getElementById("collapseBtn").setAttribute("aria-expanded", !c);
}

/* =====================================================================
   USERS — data, table rendering, selection, paging.
   Mock records stand in for a service layer. Registered people carry a
   name, gender and email; unregistered records are a phone number and
   nothing else, which is the whole reason this screen exists.
   ===================================================================== */
const FIRST_M = ["محمد","عبدالله","خالد","فيصل","نواف","سعود","عبدالعزيز","تركي","بندر","ماجد","سلطان","ياسر"];
const FIRST_F = ["سارة","نورة","ريم","لمى","هيا","العنود","منيرة","دانة","جواهر","شهد"];
const FAMILY  = ["العتيبي","القحطاني","الدوسري","الحربي","الشمري","الغامدي","الزهراني","المطيري","السبيعي","الخالدي","العنزي","البقمي"];
const LATIN_F = {"محمد":"Mohammed","عبدالله":"Abdullah","خالد":"Khaled","فيصل":"Faisal","نواف":"Nawaf","سعود":"Saud",
  "عبدالعزيز":"Abdulaziz","تركي":"Turki","بندر":"Bandar","ماجد":"Majed","سلطان":"Sultan","ياسر":"Yasser",
  "سارة":"Sarah","نورة":"Noura","ريم":"Reem","لمى":"Lama","هيا":"Haya","العنود":"Alanoud","منيرة":"Munira",
  "دانة":"Danah","جواهر":"Jawaher","شهد":"Shahad"};
const LATIN_L = {"العتيبي":"Al-Otaibi","القحطاني":"Al-Qahtani","الدوسري":"Al-Dossari","الحربي":"Al-Harbi",
  "الشمري":"Al-Shammari","الغامدي":"Al-Ghamdi","الزهراني":"Al-Zahrani","المطيري":"Al-Mutairi",
  "السبيعي":"Al-Subaie","الخالدي":"Al-Khalidi","العنزي":"Al-Anazi","البقمي":"Al-Buqami"};

const USERS = (function build(){
  let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const out = [];
  for (let i = 0; i < 46; i++){
    const registered = rnd() > 0.42;
    const female = rnd() > 0.62;
    const fa = female ? FIRST_F[Math.floor(rnd()*FIRST_F.length)] : FIRST_M[Math.floor(rnd()*FIRST_M.length)];
    const la = FAMILY[Math.floor(rnd()*FAMILY.length)];
    const phone = "9665" + String(Math.floor(rnd()*90000000) + 10000000);
    const d = new Date(2025, Math.floor(rnd()*12), 1 + Math.floor(rnd()*28));
    out.push({
      id: 2423500 + i,
      registered,
      name: registered ? { ar: fa + " " + la, en: LATIN_F[fa] + " " + LATIN_L[la] } : null,
      phone,
      email: registered ? (LATIN_F[fa] + "." + LATIN_L[la]).toLowerCase().replace("-","") + "@example.com" : null,
      gender: registered ? (female ? "female" : "male") : null,
      points: registered ? Math.floor(rnd()*24000) : Math.floor(rnd()*900),
      joined: d,
      lastActive: registered ? new Date(2026, 7, 1 + Math.floor(rnd()*29)) : null
    });
  }
  return out;
})();

/* Columns. Person, status, points, joined and the row menu are always on;
   the rest are the ones the client wanted kept without crowding the table. */
const COLS = [
  { k:"person",  always:true,  on:true },
  { k:"userId",  on:true  },
  { k:"status",  on:true  },
  { k:"points",  on:true  },
  { k:"joined",  on:true  },
  { k:"email",   on:false },
  { k:"gender",  on:false },
  { k:"activity",on:false }
];
let SEG = "all", PAGE = 1, PER = 10, SORT = { k:"joined", dir:"desc" };
const SEL = new Set();

const dfmt = d => d.toLocaleDateString(LANG === "ar" ? "ar-SA-u-ca-gregory-nu-latn" : "en-GB",
                    { day:"numeric", month:"short", year:"numeric" });
const uid = u => "USR-" + u.id;

function matching(){
  const q = (document.getElementById("q")?.value || "").trim().toLowerCase();
  return USERS.filter(u => {
    if (SEG === "reg"   && !u.registered) return false;
    if (SEG === "unreg" &&  u.registered) return false;
    if (!q) return true;
    return [u.name?.ar, u.name?.en, u.phone, u.email, uid(u)]
      .filter(Boolean).some(v => String(v).toLowerCase().includes(q));
  }).sort((a,b) => {
    const dir = SORT.dir === "asc" ? 1 : -1;
    if (SORT.k === "points") return (a.points - b.points) * dir;
    return (a.joined - b.joined) * dir;
  });
}

function renderHead(){
  const th = document.getElementById("thead"); if (!th) return;
  const sortable = { points:1, joined:1 };
  const cells = COLS.filter(c => c.on).map(c => {
    const label = t("users.columns." + c.k);
    if (sortable[c.k]) {
      const state = SORT.k === c.k ? (SORT.dir === "asc" ? "ascending" : "descending") : "none";
      return `<th aria-sort="${state}"><button class="th-sort" aria-sort="${state}" onclick="setSort('${c.k}')">
        ${label}<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button></th>`;
    }
    return `<th>${label}</th>`;
  }).join("");
  const all = matching(), allSel = all.length && all.every(u => SEL.has(u.id));
  const some = all.some(u => SEL.has(u.id));
  th.innerHTML = `<th style="width:44px"><button class="cb" role="checkbox"
      aria-checked="${allSel ? "true" : some ? "mixed" : "false"}" onclick="toggleAll()"
      data-i18n-aria="users.selection.selectPage"><svg viewBox="0 0 24 24" width="12" height="12" fill="none"
      stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12.5 4.5 4.5L19 7"/></svg></button></th>`
    + cells + `<th style="width:56px">${t("users.columns.actions")}</th>`;
}

function renderRows(){
  const tb = document.getElementById("tbody"); if (!tb) return;
  const all = matching();
  const pages = Math.max(1, Math.ceil(all.length / PER));
  if (PAGE > pages) PAGE = pages;
  const rows = all.slice((PAGE-1)*PER, PAGE*PER);
  document.getElementById("noMatch").hidden = all.length > 0;
  document.querySelector(".tbl-scroll").hidden = all.length === 0;

  tb.innerHTML = rows.map(u => {
    const sel = SEL.has(u.id);
    const cell = k => {
      switch(k){
        case "person": return `<td><div class="cell-person">
            <span class="avatar ${u.registered ? "avatar-txt" : ""}">${u.registered
              ? initials(u) : `<svg viewBox="0 0 24 24" width="20" height="20"><use href="#i-user"/></svg>`}</span>
            <div class="min-w-0">
              <div class="person-name ${u.registered ? "" : "is-empty"}">${u.registered
                ? u.name[LANG] : t("users.empty.noName")}</div>
              <div class="person-sub ltr num">${u.phone}</div>
            </div></div></td>`;
        case "userId": return `<td><span class="cell-id ltr">${uid(u)}</span></td>`;
        case "status": return `<td><span class="pill ${u.registered ? "pill-success" : "pill-stage"}">
            <svg viewBox="0 0 24 24" width="12" height="12"><use href="#i-${u.registered ? "check" : "clock"}"/></svg>
            ${t(u.registered ? "users.status.registered" : "users.status.notRegistered")}</span></td>`;
        case "points": return `<td><span class="cell-bal"><svg viewBox="0 0 24 24" width="19" height="19"><use href="#i-point"/></svg>
            <span class="num">${fmt(u.points)}</span></span></td>`;
        case "joined": return `<td><span class="cell-date">${dfmt(u.joined)}</span></td>`;
        case "email":  return `<td><span class="cell-muted ltr">${u.email || `<span class="person-name is-empty">${t("users.empty.notCollected")}</span>`}</span></td>`;
        case "gender": return `<td><span class="cell-muted">${u.gender
            ? t("users.gender." + u.gender)
            : `<span class="person-name is-empty">${t("users.empty.notCollected")}</span>`}</span></td>`;
        case "activity": return `<td><span class="cell-date">${u.lastActive
            ? dfmt(u.lastActive) : `<span class="person-name is-empty">${t("users.empty.notCollected")}</span>`}</span></td>`;
      }
    };
    return `<tr data-selected="${sel}">
      <td><button class="cb" role="checkbox" aria-checked="${sel}" onclick="toggleOne(${u.id})">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></button></td>
      ${COLS.filter(c=>c.on).map(c=>cell(c.k)).join("")}
      <td><button class="row-menu" data-i18n-aria="users.columns.actions">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none">
        <circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button></td>
    </tr>`;
  }).join("");
  renderHead(); renderFoot(all.length, pages); renderSel();
  applyI18n();
}
function initials(u){
  const n = u.name.en.split(" ");
  return (n[0][0] + (n[1] ? n[1].replace("Al-","")[0] : "")).toUpperCase();
}

function renderFoot(total, pages){
  const f = document.getElementById("tblFoot"); if (!f) return;
  const from = total ? (PAGE-1)*PER + 1 : 0, to = Math.min(PAGE*PER, total);
  const nums = [];
  const push = n => nums.push(`<button class="pg num" ${n===PAGE?'aria-current="page"':""} onclick="goPage(${n})">${fmt(n)}</button>`);
  if (pages <= 6) { for (let i=1;i<=pages;i++) push(i); }
  else {
    push(1);
    if (PAGE > 3) nums.push('<span class="pg-gap">…</span>');
    for (let i=Math.max(2,PAGE-1); i<=Math.min(pages-1,PAGE+1); i++) push(i);
    if (PAGE < pages-2) nums.push('<span class="pg-gap">…</span>');
    push(pages);
  }
  f.innerHTML = `<span>${interp(t("users.pagination.showing"), { from:fmt(from), to:fmt(to), total:fmt(total) })}</span>
    <div class="pager">
      <button class="pg" onclick="goPage(${PAGE-1})" ${PAGE===1?"disabled":""} data-i18n-aria="users.pagination.prev">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(90deg)"><path d="m8 10 4 4 4-4"/></svg></button>
      ${nums.join("")}
      <button class="pg" onclick="goPage(${PAGE+1})" ${PAGE===pages?"disabled":""} data-i18n-aria="users.pagination.next">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(-90deg)"><path d="m8 10 4 4 4-4"/></svg></button>
    </div>
    <label class="rpp"><span data-i18n="users.pagination.perPage"></span>
      <select onchange="PER=+this.value;PAGE=1;renderRows()">
        ${[10,25,50].map(n=>`<option value="${n}" ${n===PER?"selected":""}>${fmt(n)}</option>`).join("")}
      </select></label>`;
}
function goPage(n){ PAGE = n; renderRows(); }
function setSort(k){ SORT = { k, dir: SORT.k===k && SORT.dir==="desc" ? "asc" : "desc" }; renderRows(); }
function setSeg(s){
  SEG = s; PAGE = 1;
  document.querySelectorAll(".seg").forEach(b => b.setAttribute("aria-selected", b.dataset.seg === s));
  renderRows();
}
function clearFilters(){ SEG="all"; document.getElementById("q").value=""; setSeg("all"); }
function counts(){
  const r = USERS.filter(u=>u.registered).length;
  document.getElementById("segNAll").textContent   = fmt(USERS.length);
  document.getElementById("segNReg").textContent   = fmt(r);
  document.getElementById("segNUnreg").textContent = fmt(USERS.length - r);
}

/* selection */
function toggleOne(id){ SEL.has(id) ? SEL.delete(id) : SEL.add(id); renderRows(); }
function toggleAll(){
  const page = matching().slice((PAGE-1)*PER, PAGE*PER);
  const allSel = page.every(u => SEL.has(u.id));
  page.forEach(u => allSel ? SEL.delete(u.id) : SEL.add(u.id));
  renderRows();
}
function selectAllMatching(){ matching().forEach(u => SEL.add(u.id)); renderRows(); }
function clearSel(){ SEL.clear(); renderRows(); }
function renderSel(){
  const bar = document.getElementById("selbar"); if (!bar) return;
  bar.hidden = SEL.size === 0;
  if (!SEL.size) return;
  document.getElementById("selN").textContent = interp(t("users.selection.count"), { count: SEL.size });
  const all = matching();
  const btn = document.getElementById("selAllBtn");
  btn.hidden = all.every(u => SEL.has(u.id));
  btn.textContent = interp(t("users.selection.selectAllMatching"), { count: all.length });
}

/* column visibility — reuses the dropdown built for the date filter */
function colToggle(){
  const m = document.getElementById("colMenu"), b = document.getElementById("colBtn");
  if (m.hidden){
    m.innerHTML = COLS.filter(c=>!c.always).map(c => `<button class="dd-opt" role="option"
      aria-selected="${c.on}" onclick="colPick('${c.k}')">
      <svg class="dd-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
      <span>${t("users.columns."+c.k)}</span></button>`).join("");
    m.hidden = false; b.setAttribute("aria-expanded","true");
  } else { m.hidden = true; b.setAttribute("aria-expanded","false"); }
}
function colPick(k){
  const c = COLS.find(x=>x.k===k); c.on = !c.on;
  document.getElementById("colMenu").hidden = true;
  document.getElementById("colBtn").setAttribute("aria-expanded","false");
  renderRows();
}
document.addEventListener("click", e => {
  if (!e.target.closest("#colBtn") && !e.target.closest("#colMenu")){
    const m = document.getElementById("colMenu");
    if (m && !m.hidden){ m.hidden = true; document.getElementById("colBtn").setAttribute("aria-expanded","false"); }
  }
});

document.body.dataset.state = "normal";
document.body.dataset.collapsed = "false";
document.body.dataset.nav = "closed";
setLang("ar");
</script>
